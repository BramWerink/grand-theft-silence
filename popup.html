<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grand Theft Silence</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 10px; width: 270px;
      background: #0b0b10; color: #fff;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .phone {
      display: grid; gap: 10px;
      padding: 20px 14px 16px;
      border: 5px solid #0b0b10; border-radius: 34px;
      background: linear-gradient(160deg, #ff3d9a, #7a35ff 55%, #26e8d4);
      outline: 1px solid #ffffff22;
      transition: filter .25s;
    }
    body[data-on="false"] .phone { filter: grayscale(.85) brightness(.8); }
    .notch { width: 72px; height: 18px; margin: -12px auto 0; border-radius: 99px; background: #0b0b10; }
    .glass {
      display: grid; gap: 10px; padding: 12px;
      border-radius: 18px; border: 1px solid #ffffff44;
      background: #ffffff2e; backdrop-filter: blur(14px);
    }
    .app { display: flex; align-items: center; gap: 10px; }
    .app-ic {
      flex: none; width: 38px; height: 38px; border-radius: 10px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #ff9a3c, #ff3d9a);
      font: 800 15px system-ui, sans-serif; letter-spacing: .02em;
    }
    .app strong { display: block; font-size: 15px; line-height: 1.2; }
    .app span { font-size: 12px; opacity: .85; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .sw {
      position: relative; flex: none; width: 48px; height: 27px; margin-left: auto;
      border-radius: 99px; background: #ffffff40; transition: background .2s;
    }
    .sw::after {
      content: ""; position: absolute; left: 3px; top: 3px; width: 21px; height: 21px;
      border-radius: 50%; background: #fff; transition: transform .2s;
    }
    .sw[aria-checked="true"] { background: #26e8d4; }
    .sw[aria-checked="true"]::after { transform: translateX(21px); }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: #00000047; }
    .seg button { padding: 8px 6px; border-radius: 9px; font-weight: 600; font-size: 13px; color: #ffffffd0; }
    .seg button[aria-pressed="true"] { background: #fff; color: #5a1a7a; }
    #status { margin: 0; text-align: center; font-size: 12px; opacity: .9; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body data-on="true">
  <div class="phone">
    <div class="notch"></div>
    <div class="glass">
      <div class="app">
        <div class="app-ic">GS</div>
        <div><strong>Silence</strong><span>GTA 6 filter</span></div>
        <button id="toggle" class="sw" role="switch" aria-checked="true" aria-label="Enable Grand Theft Silence"></button>
      </div>
      <div class="seg">
        <button data-mode="hide" aria-pressed="true">Hide</button>
        <button data-mode="blur" aria-pressed="false">Blur</button>
      </div>
    </div>
    <p id="status"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
