<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 230px; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label.row { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .switch { position: relative; width: 42px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #bbb; border-radius: 24px; transition: .2s; }
    .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background: #2e7d32; }
    input:checked + .slider::before { transform: translateX(18px); }
    fieldset { border: 0; padding: 0; margin: 14px 0 0; }
    legend { font-size: 12px; color: #666; padding: 0; margin-bottom: 6px; }
    fieldset label { display: block; padding: 3px 0; cursor: pointer; }
    fieldset.off { opacity: .45; }
    #status { margin-top: 10px; color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Grand Theft Silence</h1>
  <label class="row">
    <span>Enabled</span>
    <span class="switch"><input type="checkbox" id="toggle"><span class="slider"></span></span>
  </label>

  <fieldset id="modes">
    <legend>When something matches</legend>
    <label><input type="radio" name="mode" value="hide"> Hide it completely</label>
    <label><input type="radio" name="mode" value="blur"> Blur it (hover to peek)</label>
  </fieldset>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
