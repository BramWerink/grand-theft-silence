<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grand Theft Silence</title>
  <style>
    :root { color-scheme: dark; --teal: #26e8d4; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; width: 320px;
      display: grid; gap: 12px;
      background: linear-gradient(180deg, #2a0a52 0%, #a3207f 45%, #ff5b6e 72%, #ffa24a 100%);
      color: #fff;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    /* sky: tagline left, full sun right */
    .sky { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 88px; }
    .tagline { margin: 0; max-width: 11ch; font-size: 24px; line-height: 1.15; font-weight: 700; text-wrap: balance; }
    .sun {
      flex: none; width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(#ffe36e, #ff3d9a);
      -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 9px, transparent 9px 12px);
      mask-image: repeating-linear-gradient(to bottom, #000 0 9px, transparent 9px 12px);
      transition: filter .25s, opacity .25s;
    }
    body[data-on="false"] .sun { filter: grayscale(1); opacity: .55; }

    /* controls panel */
    .panel { display: grid; gap: 12px; padding: 14px; border-radius: 14px; background: #12051fd9; box-shadow: inset 0 0 0 1px #ffffff1f; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; }
    .sw { position: relative; flex: none; width: 48px; height: 27px; border-radius: 99px; background: #ffffff40; transition: background .2s; }
    .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .sw[aria-checked="true"] { background: var(--teal); }
    .sw[aria-checked="true"]::after { transform: translateX(21px); }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: #00000059; }
    .seg button { padding: 8px 6px; border-radius: 9px; font-weight: 600; font-size: 13px; color: #ffffffd9; }
    .seg button[aria-pressed="true"] { background: var(--teal); color: #06221f; }

    /* live preview of what the filter does */
    .feed { display: grid; gap: 6px; min-height: 80px; align-content: start; }
    .item { padding: 9px 11px; border-radius: 9px; background: #ffffff1a; font-size: 13px; transition: filter .15s, opacity .15s; }
    .item b { color: var(--teal); margin-right: 6px; }
    body[data-on="true"][data-mode="hide"] .flag { display: none; }
    body[data-on="true"][data-mode="blur"] .flag { filter: blur(5px) grayscale(1); opacity: .6; }
    body[data-on="true"][data-mode="blur"] .flag:hover { filter: none; opacity: 1; }
    #status { margin: 0; font-size: 12px; opacity: .85; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body data-on="true" data-mode="hide">
  <div class="sky">
    <p class="tagline">Silence the hype</p>
    <div class="sun"></div>
  </div>
  <div class="panel">
    <div class="row">
      <span>Hide GTA 6</span>
      <button id="toggle" class="sw" role="switch" aria-checked="true" aria-label="Enable Grand Theft Silence"></button>
    </div>
    <div class="seg">
      <button data-mode="hide" aria-pressed="true">Hide</button>
      <button data-mode="blur" aria-pressed="false">Blur</button>
    </div>
    <div class="feed" aria-label="Preview">
      <div class="item flag"><b>▶</b>GTA 6 trailer 3 breakdown</div>
      <div class="item"><b>▶</b>10-minute pasta recipes</div>
    </div>
    <p id="status"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
